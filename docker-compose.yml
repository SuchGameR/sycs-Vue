services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sycs-nuxt-app
    command: sh -c "PORT=3000 NITRO_PORT=3000 node .output-prod/server/index.mjs"
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://sycs:sycs_password@db:5432/sycs
      - PHP_API_BASE=
      - PHP_BRIDGE_SECRET=
      - PHP_STATIC_COOKIE=
      - PHP_FORWARD_COOKIE=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # nuxt.config.ts の `devtools: { enabled: process.env.NUXT_DEVTOOLS === 'true' }` を有効化
      - NUXT_DEVTOOLS=true
    volumes:
      - .:/app
      - /app/node_modules
      - nuxt_cache:/app/.nuxt
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: sycs-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=sycs
      - POSTGRES_PASSWORD=sycs_password
      - POSTGRES_DB=sycs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sycs"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Cloudflare Tunnel (HTTPS 終端 + 公開ドメイン)
  # ------------------------------------------------------------------
  # なぜ必要か: getUserMedia はセキュアコンテキスト (https / localhost) でのみ
  # 存在する。スマホから LAN IP で http:// アクセスすると navigator.mediaDevices が
  # undefined になり、WebRTC 通話が根本的に成立しない。Tunnel を挟むと端末側は
  # https になり、証明書の手動信頼の作業が不要になる。
  #
  # profiles で無効化しているので、`docker compose up -d` だけでは起動しない。
  # 有効化するには:
  #   docker compose --profile tunnel up -d --no-deps tunnel
  # 起動するたびにランダムな URL (https://xxx.trycloudflare.com) が発行され、
  # スマホではその URL を開く。ログから読み取ること。
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: sycs-tunnel
    profiles: ["tunnel"]
    # Quick Tunnel なのでトークンもドメインも要らない。`--url` に叩き先を渡す
    # だけで https://<ランダム>.trycloudflare.com が発行される。
    #
    # 宛先は localhost ではなく compose ネットワーク上のサービス名 `app`。
    # このコンテナ有自己的 localhost なので localhost を指定すると自分自身に
    # _CONNECT して必ず失敗する。
    #
    # image の ENTRYPOINT は ["cloudflared","--no-autoupdate"] で shell が入って
    # いないため、command はそのまま cloudflared の引数になる。
    command: tunnel --url http://app:3000
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  nuxt_cache:
  uploads:
