services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sycs-nuxt-app
    command: sh -c "PORT=3000 NITRO_PORT=3000 node .output-prod/server/index.mjs"
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://sycs:sycs_password@db:5432/sycs
      - PHP_API_BASE=
      - PHP_BRIDGE_SECRET=
      - PHP_STATIC_COOKIE=
      - PHP_FORWARD_COOKIE=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # nuxt.config.ts の `devtools: { enabled: process.env.NUXT_DEVTOOLS === 'true' }` を有効化
      - NUXT_DEVTOOLS=true
    volumes:
      - .:/app
      - /app/node_modules
      - nuxt_cache:/app/.nuxt
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: sycs-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=sycs
      - POSTGRES_PASSWORD=sycs_password
      - POSTGRES_DB=sycs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sycs"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Cloudflare Tunnel (HTTPS 終端 + 公開ドメイン)
  # ------------------------------------------------------------------
  # なぜ必要か: getUserMedia はセキュアコンテキスト (https / localhost) でのみ
  # 存在する。スマホから LAN IP で http:// アクセスすると navigator.mediaDevices が
  # undefined になり、WebRTC 通話が根本的に成立しない。Tunnel を挟むと端末側は
  # https になり、証明書の手動信頼作业が不要になる。
  #
  # profiles で無効化しているので、`docker compose up -d` だけでは起動しない。
  # 有効化するには:
  #   docker compose --profile tunnel up -d
  # トークンは .env の CLOUDFLARE_TUNNEL_TOKEN に置く (.env は gitignore 済み)。
  # 公開ホスト名は Tunnel 作成時の設定側に持つので、アプリ側は変更不要。
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: sycs-tunnel
    profiles: ["tunnel"]
    # 空を既定にしてあるのは、`${VAR:?}` を付けるとトークン未設定のだけで
    # `docker compose config` 全体が失敗し、tunnel をibirわない平时的
    # `docker compose up -d` まで巻き込んで壊れるため。トークンが空のまま
    # --profile tunnel を付けると cloudflared 自身が明示的にエラーにする。
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  nuxt_cache:
  uploads:
