services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sycs-nuxt-app
    command: sh -c "bun run dev & ([ -d .output-prod ] && PORT=3001 NITRO_PORT=3001 node .output-prod/server/index.mjs > /tmp/prod.log 2>&1); tail -f /dev/null"
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://sycs:sycs_password@db:5432/sycs
      - PHP_API_BASE=
      - PHP_BRIDGE_SECRET=
      - PHP_STATIC_COOKIE=
      - PHP_FORWARD_COOKIE=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - nuxt_cache:/app/.nuxt
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: sycs-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=sycs
      - POSTGRES_PASSWORD=sycs_password
      - POSTGRES_DB=sycs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sycs"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  nuxt_cache:
  uploads:
